<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08101a">
<title>Acerola Life 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101a;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}body{touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:4}.pill{background:rgba(9,18,29,.82);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.25);border-radius:18px;padding:9px 12px;white-space:nowrap}.brand{font-weight:800;letter-spacing:.3px}.money{margin-left:auto;font-weight:800}.plus{pointer-events:auto;border:0;border-radius:50%;width:38px;height:38px;font-size:24px;line-height:38px;background:#19c37d;color:#05130d;font-weight:900}.online{font-size:12px;color:#8ff0c2}.panel{position:absolute;left:14px;top:92px;width:min(370px,calc(100vw - 28px));padding:15px;border-radius:22px;background:rgba(11,20,31,.78);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(15px);box-shadow:0 18px 45px rgba(0,0,0,.25);pointer-events:auto}.panel h2{font-size:18px;margin:0 0 2px}.muted{color:#aeb9c5;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:8px;background:#20d28a}.task{margin-top:10px;color:#dfe7ef}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button,.bottom button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;min-height:42px;padding:9px 12px;font-weight:700}.actions button:active,.bottom button:active{transform:scale(.97)}.leave{width:100%;background:#fff!important;color:#08101a!important;border:0!important}.status{position:absolute;left:14px;bottom:92px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 28px)}.need{padding:7px 9px;border-radius:12px;background:rgba(8,16,26,.78);border:1px solid rgba(255,255,255,.1);font-size:11px;backdrop-filter:blur(10px)}.bottom{position:absolute;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));height:66px;border-radius:22px;background:rgba(248,251,253,.96);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;gap:5px;pointer-events:auto;box-shadow:0 12px 35px rgba(0,0,0,.25)}.bottom button{border:0;background:transparent;color:#506070;min-height:52px}.bottom button.active{background:#0d1724;color:#fff}.bottom small{display:block;font-size:11px;margin-top:3px}.controls{position:absolute;right:14px;bottom:180px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;pointer-events:auto}.controls button{border:1px solid rgba(255,255,255,.14);background:rgba(8,16,26,.68);color:#fff;border-radius:16px;font-size:18px;backdrop-filter:blur(10px)}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.hint{position:absolute;right:14px;top:92px;width:min(260px,42vw);padding:12px;border-radius:17px;background:rgba(8,16,26,.72);border:1px solid rgba(255,255,255,.1);font-size:12px;color:#d8e1e9;backdrop-filter:blur(12px)}#toast{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);background:rgba(8,16,26,.9);border:1px solid rgba(255,255,255,.14);padding:10px 15px;border-radius:14px;opacity:0;transition:opacity .2s;white-space:nowrap}@media(max-width:600px){.hint{display:none}.panel{top:82px}.controls{bottom:180px;right:10px;transform:scale(.88);transform-origin:bottom right}.top .online{display:none}.brand{font-size:13px}.money{font-size:13px}.pill{padding:8px 10px}.panel{width:min(340px,calc(100vw - 28px));transform:scale(.94);transform-origin:top left}.status{bottom:88px}.bottom{height:62px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="top">
    <div class="pill brand">🧑🏾 Acerola Life</div>
    <div class="pill">☀️ <span id="clock">8:00 AM</span> · <span id="mood">😊</span></div>
    <div class="pill money" id="money">₦25,000</div><button class="plus" id="addMoney">+</button>
    <div class="pill online">● 1,284 online</div>
  </div>
  <section class="panel" id="jobPanel">
    <h2 id="jobTitle">Student</h2><div class="muted" id="place">Acerola Academy</div>
    <div class="row"><span>Daily progress</span><strong id="progressText">35%</strong></div>
    <div class="bar"><i id="progressBar" style="width:35%"></i></div>
    <div class="row"><span>⭐ Reputation</span><strong id="rep">2 / 5</strong></div>
    <div class="task">Task · <span id="task">Attend class</span></div>
    <div class="actions">
      <button data-action="study">📚 Study</button><button data-action="social">💬 Socialize</button><button data-action="eat">🍛 Eat</button><button data-action="rest">😴 Rest</button>
      <button class="leave" data-action="work">Work / Attend class</button>
    </div>
  </section>
  <div class="status" id="needs"></div>
  <div class="controls" aria-label="movement controls"><button class="up" data-key="w">▲</button><button class="left" data-key="a">◀</button><button class="down" data-key="s">▼</button><button class="right" data-key="d">▶</button></div>
  <div class="hint">3D world · Drag the scene to rotate the camera · Use the movement buttons to explore.</div>
  <nav class="bottom">
    <button class="active" data-tab="home">🏠<small>Home</small></button><button data-tab="shop">🛍️<small>Shop</small></button><button data-tab="map">🗺️<small>Map</small></button><button data-tab="phone">📱<small>Phone</small></button>
  </nav>
  <div id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
