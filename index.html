<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#050816">
<meta name="description" content="Acerola AI — a focused AI chat workspace.">
<title>Acerola AI</title>
<style>
:root{--bg:#050816;--panel:#0b1224;--panel2:#101a31;--line:#1c2a47;--cyan:#00eaff;--pink:#ff2b9a;--text:#edf8ff;--muted:#8495b1;--good:#65f5a0;--safe:env(safe-area-inset-bottom,0px);--app:100dvh}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{height:var(--app);min-height:0;display:flex;flex-direction:column;background:radial-gradient(circle at 75% -10%,#132858 0,transparent 35%),var(--bg)}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(5,8,22,.88);backdrop-filter:blur(18px);z-index:5}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#0b1428;display:grid;place-items:center;font-size:19px}.icon-btn:hover{border-color:#2a6275}.brand{min-width:0;flex:1}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px}.status{display:flex;align-items:center;gap:6px;color:var(--good);font-size:9px;letter-spacing:1px;border:1px solid #185443;background:#071b16;border-radius:999px;padding:6px 9px}.dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
.chat{min-height:0;flex:1;display:flex;flex-direction:column}.messages{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain}.messages-inner{max-width:850px;min-height:100%;margin:auto;padding:22px 16px 16px;display:flex;flex-direction:column}.welcome{margin:auto 0 20px}.eyebrow{color:var(--cyan);font-size:10px;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:10px}.welcome h1{font-size:clamp(30px,7vw,48px);line-height:1.03;letter-spacing:-1.8px;margin:0 0 12px}.gradient{background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{max-width:620px;color:var(--muted);margin:0 0 18px;font-size:13px}.suggestions{display:flex;flex-wrap:wrap;gap:8px}.suggestion{border:1px solid var(--line);background:#0b1427;border-radius:12px;padding:10px 12px;font-size:11px;text-align:left}.suggestion:hover{border-color:#2a6074;background:#0d1a31}
.message-list{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}.row{display:flex;gap:9px;align-items:flex-start}.row.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:none;border:1px solid #175766;background:#081725;color:var(--cyan);border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:11px}.row.user .avatar{order:2;border-color:#603052;color:#ff6ab9;background:#190e1b}.bubble{max-width:min(760px,86%);border:1px solid var(--line);background:#091225;border-radius:15px;padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}.row.user .bubble{background:linear-gradient(135deg,#21132b,#171024);border-color:#4b2852}.name{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:3px}.row.user .name{color:#ff69b8}.typing{display:inline-flex;gap:4px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,70%,100%{opacity:.25}35%{opacity:1;transform:translateY(-2px)}}
.composer-area{flex:none;padding:8px 12px calc(10px + var(--safe));background:linear-gradient(180deg,transparent,#050816 22%);z-index:4}.composer{max-width:850px;margin:auto;border:1px solid #29405f;background:#080f20;border-radius:17px;padding:7px;display:flex;align-items:flex-end;gap:7px;box-shadow:0 12px 38px #0008}.composer:focus-within{border-color:#2a6a7c;box-shadow:0 12px 38px #0009,0 0 20px #00eaff0d}.attach,.mic,.send{width:39px;height:39px;flex:none;border:1px solid var(--line);background:#0b1529;border-radius:12px;display:grid;place-items:center;font-size:17px}.send{border-color:#087987;color:var(--cyan);background:#0a1b27;font-weight:900}.mic.active{border-color:#a52c70;color:#ff63b6}.input-wrap{flex:1;min-width:0}.input-wrap textarea{display:block;width:100%;min-height:39px;max-height:120px;resize:none;border:0;outline:0;background:transparent;padding:9px 3px;line-height:21px}.input-wrap textarea::placeholder{color:#687b99}.hint{max-width:850px;margin:5px auto 0;text-align:center;color:#4f627e;font-size:9px}
.drawer-backdrop{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s;z-index:20}.drawer{position:fixed;z-index:21;left:0;top:0;bottom:0;width:min(330px,88vw);background:#070b17;border-right:1px solid var(--line);transform:translateX(-102%);transition:.22s;display:flex;flex-direction:column;box-shadow:20px 0 60px #0008}.drawer.open{transform:none}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer-head{height:66px;flex:none;display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}.drawer-title{flex:1}.drawer-title strong{font-size:17px}.drawer-title small{display:block;color:var(--muted);font-size:10px}.new-chat{border:1px solid #236078;background:#0b2030;color:var(--cyan);border-radius:11px;padding:9px 11px;font-size:11px;font-weight:700}.history{min-height:0;overflow:auto;padding:12px}.history-label{font-size:9px;color:#607390;letter-spacing:1.5px;text-transform:uppercase;padding:5px 7px 8px}.history-item{width:100%;border:1px solid transparent;background:transparent;border-radius:11px;padding:10px;text-align:left;margin-bottom:4px}.history-item:hover{background:#0d1527;border-color:var(--line)}.history-item.active{background:#0d1c31;border-color:#1b4d62}.history-item strong{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item span{display:block;color:#607390;font-size:9px;margin-top:2px}.drawer-foot{padding:12px;border-top:1px solid var(--line);color:#607390;font-size:9px;text-align:center}.empty-history{text-align:center;color:var(--muted);padding:35px 15px;font-size:11px}
@media(min-width:760px){.topbar{height:66px;padding:0 20px}.messages-inner{padding-left:24px;padding-right:24px}.composer-area{padding-left:20px;padding-right:20px}}
@media(max-width:520px){.topbar{height:58px;padding:0 10px}.status{font-size:8px;padding:5px 7px}.brand strong{font-size:15px}.brand small{display:none}.messages-inner{padding:14px 11px 10px}.welcome{margin:auto 0 15px}.welcome h1{font-size:34px}.welcome p{font-size:12px}.suggestions{display:grid;grid-template-columns:1fr}.suggestion{padding:10px}.bubble{max-width:89%}.composer-area{padding:7px 9px calc(8px + var(--safe))}.hint{display:none}.attach{display:none}.composer{border-radius:16px;padding:6px}.send,.mic{width:38px;height:38px}.input-wrap textarea{font-size:15px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open chat history">☰</button>
    <div class="brand"><strong>Acerola AI</strong><small>Focused AI workspace</small></div>
    <div class="status"><i class="dot"></i> CORE ONLINE</div>
  </header>
  <section class="chat">
    <div class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></div>
    <div class="composer-area">
      <div class="composer">
        <button class="attach" type="button" title="New chat" id="quickNew">＋</button>
        <div class="input-wrap"><textarea id="input" rows="1" placeholder="Message Acerola AI…" autocomplete="off" autocapitalize="sentences"></textarea></div>
        <button class="mic" type="button" id="micBtn" title="Voice input">🎙</button>
        <button class="send" type="button" id="sendBtn" aria-label="Send">↑</button>
      </div>
      <div class="hint">Enter to send · Shift + Enter for a new line</div>
    </div>
  </section>
</div>
<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Chat history">
  <div class="drawer-head">
    <button class="icon-btn" id="closeDrawer" aria-label="Close">×</button>
    <div class="drawer-title"><strong>Chats</strong><small>Your conversations</small></div>
    <button class="new-chat" id="newChat">＋ New chat</button>
  </div>
  <div class="history" id="history"></div>
  <div class="drawer-foot">Acerola AI · Chat history is stored on this device.</div>
</aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="agent-core.js?v=0.9.3"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),input=$('#input'),messages=$('#messages'),messagesInner=$('#messagesInner'),HISTORY_KEY='acerola-ai-chats-v2',ACTIVE_KEY='acerola-ai-active-chat-v2';
let chats=loadChats(),activeId=localStorage.getItem(ACTIVE_KEY),core=null,busy=false,recognition=null;
function uid(){return'chat_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function loadChats(){try{const x=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function save(){localStorage.setItem(HISTORY_KEY,JSON.stringify(chats));if(activeId)localStorage.setItem(ACTIVE_KEY,activeId)}
function ensureChat(){if(!activeId||!chats.some(c=>c.id===activeId)){const c={id:uid(),title:'New chat',createdAt:Date.now(),updatedAt:Date.now(),messages:[]};chats.unshift(c);activeId=c.id;save()}}
function active(){return chats.find(c=>c.id===activeId)}
function titleFor(text){const t=text.replace(/\s+/g,' ').trim();return t.length>38?t.slice(0,38)+'…':t||'New chat'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderHistory(){const h=$('#history');if(!chats.length){h.innerHTML='<div class="empty-history">No conversations yet.<br>Start a new chat.</div>';return}h.innerHTML='<div class="history-label">Recent</div>'+chats.slice().sort((a,b)=>b.updatedAt-a.updatedAt).map(c=>`<button class="history-item ${c.id===activeId?'active':''}" data-id="${c.id}"><strong>${esc(c.title)}</strong><span>${new Date(c.updatedAt).toLocaleDateString([], {month:'short',day:'numeric'})} · ${c.messages.length} message${c.messages.length===1?'':'s'}</span></button>`).join('');h.querySelectorAll('.history-item').forEach(b=>b.onclick=()=>{activeId=b.dataset.id;save();renderChat();renderHistory();closeDrawer()})}
function renderChat(){ensureChat();const c=active();messagesInner.innerHTML='';if(!c.messages.length){messagesInner.innerHTML=`<div class="welcome"><div class="eyebrow">● AGENT CORE / READY</div><h1>What can <span class="gradient">Acerola</span> do for you?</h1><p>Ask a question, start a conversation, or use one of the quick prompts below. Your chats stay organized in history.</p><div class="suggestions"><button class="suggestion" data-prompt="What can you do?">✨ What can you do?</button><button class="suggestion" data-prompt="Explain how you work">⚡ How do you work?</button><button class="suggestion" data-prompt="Help me plan something">🧠 Help me plan something</button></div></div>`;messagesInner.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;send()})}else{const list=document.createElement('div');list.className='message-list';c.messages.forEach(m=>{const row=document.createElement('div');row.className='row '+m.role;row.innerHTML=`<div class="avatar">${m.role==='user'?'Y':'A'}</div><div class="bubble"><div class="name">${m.role==='user'?'You':'Acerola'}</div><div>${esc(m.content)}</div></div>`;list.appendChild(row)});messagesInner.appendChild(list)}requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)}
function addMessage(role,content){const c=active();c.messages.push({role,content:String(content),at:Date.now()});c.updatedAt=Date.now();if(role==='user'&&c.title==='New chat')c.title=titleFor(content);save();renderChat();renderHistory()}
function showTyping(){const list=messagesInner.querySelector('.message-list')||(()=>{const x=document.createElement('div');x.className='message-list';messagesInner.innerHTML='';messagesInner.appendChild(x);return x})();const row=document.createElement('div');row.className='row assistant';row.id='typing';row.innerHTML='<div class="avatar">A</div><div class="bubble"><div class="name">Acerola</div><span class="typing"><i></i><i></i><i></i></span></div>';list.appendChild(row);requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)}
function removeTyping(){const t=$('#typing');if(t)t.remove()}
async function send(){if(busy)return;const text=input.value.trim();if(!text)return;input.value='';resizeInput();addMessage('user',text);busy=true;showTyping();try{if(!core){core=new window.AcerolaAI.AgentCore();await core.initialize()}const result=await core.process(text,{app:'Acerola AI',chat_id:activeId});let reply='';if(result.type==='model_request'){const response=await core.gateway.complete(result.payload);reply=response.reply||'I could not generate a response.';if(response.plan?.type==='tool_call'){try{const action=await core.executePlannedAction(response.plan);if(action?.ok)reply=typeof action.result==='string'?action.result:JSON.stringify(action.result)}catch(e){reply=e.message||reply}}}else if(result.type==='action'||result.type==='memory')reply=result.result!==undefined?String(result.result):result.text||'Done.';else if(result.type==='status')reply=`Agent Core ${result.version} is online. ${result.memoryCount} memories and ${result.conversationTurns} conversation turns are available.`;else reply=result.text||'Done.';addMessage('assistant',reply);try{core.recordAssistant(reply)}catch{}}catch(e){addMessage('assistant','I ran into a connection problem. Please try again in a moment.');console.error(e)}finally{removeTyping();busy=false;input.focus()}}
function newChat(){const c={id:uid(),title:'New chat',createdAt:Date.now(),updatedAt:Date.now(),messages:[]};chats.unshift(c);activeId=c.id;save();renderChat();renderHistory();closeDrawer();input.focus()}
function openDrawer(){$('#drawer').classList.add('open');$('#backdrop').classList.add('open');renderHistory()}
function closeDrawer(){$('#drawer').classList.remove('open');$('#backdrop').classList.remove('open')}
function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'}
function setAppHeight(){const h=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--app',h+'px')}
function initVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#micBtn').style.display='none';return}recognition=new SR();recognition.lang=navigator.language||'en-NG';recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>$('#micBtn').classList.add('active');recognition.onend=()=>$('#micBtn').classList.remove('active');recognition.onresult=e=>{input.value=Array.from(e.results).map(r=>r[0].transcript).join('');resizeInput()}}
$('#sendBtn').onclick=send;$('#newChat').onclick=newChat;$('#quickNew').onclick=newChat;$('#menuBtn').onclick=openDrawer;$('#closeDrawer').onclick=closeDrawer;$('#backdrop').onclick=closeDrawer;$('#micBtn').onclick=()=>{if(recognition){try{recognition.start()}catch{}}};input.addEventListener('input',resizeInput);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener('resize',setAppHeight);window.visualViewport?.addEventListener('resize',setAppHeight);window.visualViewport?.addEventListener('scroll',setAppHeight);setAppHeight();ensureChat();renderChat();renderHistory();initVoice();
})();
</script>
</body>
</html>
