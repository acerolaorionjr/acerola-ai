<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#050816">
<meta name="description" content="Acerola AI — an intelligent agent workspace for chat, memory and actions.">
<title>Acerola AI</title>
<style>
:root{--bg:#040712;--panel:#0a1020;--line:#1b2a49;--line2:#25385d;--cyan:#00eaff;--pink:#ff2b9a;--text:#edf8ff;--muted:#8495b1;--good:#66f7a0;--bad:#ff647f;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}.hidden{display:none!important}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{height:100dvh;min-height:100dvh;display:grid;grid-template-columns:238px minmax(0,1fr);background:radial-gradient(circle at 70% -10%,#132858 0,transparent 34%),radial-gradient(circle at 0 100%,#071c32 0,transparent 30%),var(--bg)}
.sidebar{border-right:1px solid var(--line);background:rgba(5,10,24,.92);backdrop-filter:blur(18px);display:flex;flex-direction:column;padding:18px 14px;min-width:0}.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 22px}.orb{width:42px;height:42px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-weight:900;font-size:17px;box-shadow:0 0 26px #00eaff2e,inset 0 0 15px #00eaff12}.brand strong{font-size:13px;letter-spacing:1.8px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.section-label{font-size:9px;text-transform:uppercase;letter-spacing:1.8px;color:#607390;padding:0 9px 8px}.nav{display:grid;gap:5px}.nav button{width:100%;border:1px solid transparent;background:transparent;border-radius:11px;padding:11px 10px;display:flex;align-items:center;gap:11px;text-align:left;color:var(--muted);transition:.18s}.nav button:hover{background:#0b1529;color:var(--text);border-color:#172a49}.nav button.active{background:linear-gradient(90deg,#0d2139,#0b172d);border-color:#174563;color:var(--text);box-shadow:inset 2px 0 var(--cyan),0 0 18px #00eaff08}.nav-icon{width:20px;text-align:center;color:var(--cyan);font-size:16px}.sidebar-spacer{flex:1}.session-card{border:1px solid var(--line);background:#081126;border-radius:13px;padding:12px}.session-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.badge{font-size:9px;letter-spacing:.8px;border:1px solid #1b6570;border-radius:999px;padding:3px 6px;color:var(--cyan)}.tiny{font-size:10px;color:var(--muted)}
main{min-width:0;min-height:0;display:grid;grid-template-rows:64px minmax(0,1fr);position:relative}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(4,7,18,.65);backdrop-filter:blur(14px);z-index:5}.top-left{display:flex;align-items:center;gap:11px;min-width:0}.mobile-menu{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#0a1326}.topbar h1{margin:0;font-size:17px;letter-spacing:.2px}.topbar p{margin:1px 0 0;color:var(--muted);font-size:11px}.status-pill{display:flex;align-items:center;gap:7px;border:1px solid #174f42;background:#071917;color:var(--good);padding:6px 10px;border-radius:999px;font-size:9px;letter-spacing:1px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good)}
.view{min-height:0;overflow:hidden}.screen{height:100%;min-height:0;overflow:auto}.screen-inner{max-width:1080px;margin:0 auto;padding:24px}.chat-screen{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}.chat-scroll{min-height:0;overflow:auto;scroll-behavior:smooth}.chat-inner{max-width:900px;margin:0 auto;padding:24px 24px 18px;min-height:100%;display:flex;flex-direction:column}.welcome{margin:auto 0 18px;padding:8px 0}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--cyan);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}.welcome h2{font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-1.5px;margin:0 0 10px;max-width:650px}.gradient-text{background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{max-width:650px;color:var(--muted);font-size:14px;margin:0 0 22px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:700px}.quick{border:1px solid var(--line);background:linear-gradient(135deg,#0b1428,#091121);border-radius:13px;padding:13px;text-align:left;transition:.18s}.quick:hover{border-color:#24607a;transform:translateY(-1px);background:#0d1930}.quick strong{display:block;font-size:12px;margin-bottom:2px}.quick span{color:var(--muted);font-size:11px}
.messages{display:flex;flex-direction:column;gap:15px;padding-bottom:18px}.msg-row{display:flex;gap:10px;align-items:flex-start}.msg-row.user{justify-content:flex-end}.avatar{width:30px;height:30px;border:1px solid #185a69;border-radius:10px;display:grid;place-items:center;color:var(--cyan);background:#081725;flex:none;font-size:12px;font-weight:800}.msg-row.user .avatar{order:2;border-color:#63305b;color:#ff6bb8;background:#170d1a}.bubble{max-width:min(760px,84%);border:1px solid var(--line);background:#091225;border-radius:15px;padding:11px 14px;box-shadow:0 7px 25px rgba(0,0,0,.12)}.msg-row.user .bubble{background:linear-gradient(135deg,#21132b,#171024);border-color:#4a2851}.msg-name{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--cyan);margin-bottom:3px}.msg-row.user .msg-name{color:#ff65b6}.msg-text{white-space:pre-wrap;overflow-wrap:anywhere}.thinking .bubble{opacity:.75}.dots{display:inline-flex;gap:4px;vertical-align:middle}.dots i{width:5px;height:5px;background:var(--cyan);border-radius:50%;animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
.composer-wrap{padding:8px 18px calc(14px + var(--safe-bottom));background:linear-gradient(180deg,transparent 0%,rgba(4,7,18,.93) 25%);z-index:4}.composer{max-width:900px;margin:0 auto;border:1px solid #253a5d;background:#080f20;border-radius:18px;box-shadow:0 14px 45px rgba(0,0,0,.38),0 0 0 1px #07101f;display:flex;align-items:flex-end;gap:8px;padding:8px}.composer:focus-within{border-color:#24647a;box-shadow:0 14px 45px rgba(0,0,0,.4),0 0 22px #00eaff0b}.round-btn{width:39px;height:39px;flex:none;border:1px solid var(--line);background:#0b1529;border-radius:12px;display:grid;place-items:center;font-size:17px}.round-btn:hover{border-color:#2b526d}.text-box{flex:1;min-width:0}.text-box textarea{width:100%;min-height:39px;max-height:130px;resize:none;border:0;outline:0;background:transparent;padding:9px 4px;color:var(--text);line-height:21px}.text-box textarea::placeholder{color:#687b99}.send-btn{width:39px;height:39px;flex:none;border:1px solid #087a87;background:linear-gradient(135deg,#0c2430,#0b1728);border-radius:12px;color:var(--cyan);display:grid;place-items:center;font-size:17px;font-weight:900}.composer-hint{max-width:900px;margin:6px auto 0;text-align:center;color:#536681;font-size:9px}.mic-active{border-color:#e22a8c!important;color:#ff65b6!important;box-shadow:0 0 18px #ff2b9a22}
.dashboard-hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#0b1830,#080d1d 65%);padding:26px;margin-bottom:14px;box-shadow:0 18px 60px rgba(0,0,0,.34)}.dashboard-hero:after{content:'';position:absolute;width:180px;height:180px;border:1px solid #00eaff1c;border-radius:50%;right:-55px;top:-55px;box-shadow:0 0 0 24px #00eaff06,0 0 0 48px #00eaff03}.dashboard-hero h2{font-size:28px;margin:0 0 6px}.dashboard-hero p{margin:0;color:var(--muted);max-width:650px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.stat{border:1px solid var(--line);background:#091226;border-radius:13px;padding:13px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:20px;color:var(--cyan);margin-top:2px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 9px}.section-head h3{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:1.3px}.section-head span{font-size:10px;color:var(--muted)}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feature-card,.panel{border:1px solid var(--line);border-radius:14px;background:#091225;padding:15px}.feature-card{min-height:115px}.feature-icon{width:34px;height:34px;border:1px solid #1c5261;border-radius:10px;display:grid;place-items:center;color:var(--cyan);margin-bottom:10px}.feature-card strong{font-size:12px}.feature-card p,.panel p{font-size:11px;color:var(--muted);margin:4px 0 0}
.two-col{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.list{display:grid;gap:8px}.memory-row,.tool-row{border:1px solid var(--line);background:#080f20;border-radius:11px;padding:11px;display:flex;align-items:center;gap:10px}.memory-main{min-width:0;flex:1}.memory-main strong{display:block;font-size:11px}.memory-main span{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memory-row button{border:0;background:transparent;color:#6e7f98;font-size:17px}.memory-row button:hover{color:var(--pink)}.tool-row .feature-icon{margin:0;width:32px;height:32px}.empty{border:1px dashed var(--line2);border-radius:13px;padding:28px 15px;text-align:center;color:var(--muted);font-size:11px}.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.tool-name{font-weight:700;font-size:11px}.tool-desc{font-size:10px;color:var(--muted);margin-top:2px}.settings-list{display:grid;gap:10px}.setting-row{border:1px solid var(--line);background:#091225;border-radius:13px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.setting-row strong{font-size:12px}.setting-row p{margin:3px 0 0}.btn{border:1px solid var(--line2);background:#0c172b;border-radius:9px;padding:8px 11px;font-size:10px}.btn:hover{border-color:#2a5c74}.btn.danger{color:var(--bad);border-color:#5d2939}.mobile-nav{display:none}
#toast{position:fixed;left:50%;bottom:calc(85px + var(--safe-bottom));transform:translate(-50%,12px);padding:10px 14px;border:1px solid #146274;border-radius:12px;background:#081526;box-shadow:0 10px 35px rgba(0,0,0,.4);font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:14px 8px}.brand{justify-content:center}.brand>div:last-child,.section-label,.nav button span:not(.nav-icon),.session-card{display:none}.nav button{justify-content:center;padding:12px 4px}.stat-grid{grid-template-columns:repeat(2,1fr)}.feature-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
@media(max-width:650px){html,body{font-size:14px}.app{display:block;height:100dvh;min-height:100dvh}.sidebar{display:none}main{height:100dvh;min-height:100dvh;grid-template-rows:56px minmax(0,1fr)}.topbar{height:56px;padding:0 12px}.top-left{gap:8px}.mobile-menu{display:none}.topbar h1{font-size:15px}.topbar p{display:none}.status-pill{padding:5px 8px;font-size:8px}.view{height:calc(100dvh - 56px);min-height:0}.chat-screen{height:100%;grid-template-rows:minmax(0,1fr) auto}.chat-inner{padding:15px 13px 10px}.welcome{margin:auto 0 12px}.welcome h2{font-size:34px;letter-spacing:-1.4px}.welcome p{font-size:12px;margin-bottom:16px}.quick-grid{grid-template-columns:1fr;gap:8px}.quick{padding:11px}.quick strong{font-size:11px}.quick span{font-size:10px}.messages{gap:11px}.bubble{max-width:86%;padding:10px 12px;border-radius:14px}.avatar{width:28px;height:28px}.composer-wrap{padding:5px 10px calc(8px + var(--safe-bottom));background:linear-gradient(180deg,transparent,#040712 20%)}.composer{border-radius:17px;padding:6px;gap:5px}.round-btn,.send-btn{width:37px;height:37px;border-radius:11px}.text-box textarea{min-height:37px;padding:8px 3px;font-size:13px}.composer-hint{display:none}.mobile-nav{position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:58px;padding:5px 8px calc(5px + var(--safe-bottom));border-top:1px solid var(--line);background:rgba(5,10,22,.96);backdrop-filter:blur(16px);z-index:5}.mobile-nav button{border:0;background:transparent;color:#687a97;border-radius:10px;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.mobile-nav button.active{color:var(--cyan);background:#0b192c}.mobile-nav .mi{font-size:16px;line-height:1}.screen-inner{padding:14px}.dashboard-hero{padding:19px;border-radius:16px}.dashboard-hero h2{font-size:22px}.dashboard-hero p{font-size:11px}.stat-grid{grid-template-columns:1fr 1fr;margin-top:15px}.stat b{font-size:17px}.feature-grid,.tool-grid{grid-template-columns:1fr}.feature-card{min-height:0}.section-head{margin-top:16px}.setting-row{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="orb">A</div><div><strong>ACEROLA AI</strong><small>agent workspace</small></div></div>
  <div class="section-label">Workspace</div>
  <nav class="nav" id="sideNav">
    <button class="active" data-view="chat"><span class="nav-icon">◈</span><span>Chat</span></button>
    <button data-view="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
    <button data-view="memory"><span class="nav-icon">▣</span><span>Memory</span></button>
    <button data-view="tools"><span class="nav-icon">⚡</span><span>Tools</span></button>
    <button data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="session-card"><div class="session-top"><strong style="font-size:11px">Agent Core</strong><span class="badge">ONLINE</span></div><div class="tiny" style="margin-top:5px">Acerola is ready for commands.</div></div>
</aside>
<main>
<header class="topbar"><div class="top-left"><div><h1 id="title">Acerola AI</h1><p id="subtitle">Your intelligent workspace</p></div></div><div class="status-pill"><i class="status-dot"></i><span id="topStatus">CORE ONLINE</span></div></header>
<section class="view" id="view"></section>
<nav class="mobile-nav" id="mobileNav"><button class="active" data-view="chat"><span class="mi">◈</span>Chat</button><button data-view="dashboard"><span class="mi">⌂</span>Home</button><button data-view="memory"><span class="mi">▣</span>Memory</button><button data-view="tools"><span class="mi">⚡</span>Tools</button></nav>
</main>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="agent-core.js?v=0.9.2"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);const core=new window.AcerolaAI.AgentCore();let busy=false,toastTimer=null,currentView='chat',chatMessages=null;
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function notify(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function syncStats(){const mc=core.memory?.all?.().length||0,cc=core.conversation?.count?.()||0;document.querySelectorAll('[data-memory-count]').forEach(e=>e.textContent=mc);document.querySelectorAll('[data-conversation-count]').forEach(e=>e.textContent=cc)}
function setView(name){currentView=name;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='chat')chatView();else if(name==='dashboard')dashboardView();else if(name==='memory')memoryView();else if(name==='tools')toolsView();else settingsView();syncStats()}
function shell(inner){return '<div class="screen"><div class="screen-inner">'+inner+'</div></div>'}
function messageRow(who,text,thinking=false){const row=document.createElement('div');row.className='msg-row '+(who==='You'?'user ':'')+(thinking?'thinking':'');const content=thinking?'<span>Thinking</span> <span class="dots"><i></i><i></i><i></i></span>':esc(text);row.innerHTML='<div class="avatar">'+(who==='You'?'Y':'A')+'</div><div class="bubble"><div class="msg-name">'+who+'</div><div class="msg-text">'+content+'</div></div>';return row}
function chatView(){
$('#title').textContent='Acerola AI';$('#subtitle').textContent='Your intelligent workspace';
$('#view').innerHTML='<div class="chat-screen"><div class="chat-scroll" id="chatScroll"><div class="chat-inner" id="chatInner"><div class="welcome" id="welcome"><div class="eyebrow"><i></i> Agent Core // Ready</div><h2>What can <span class="gradient-text">Acerola</span> do for you?</h2><p>Ask questions, run built-in actions, work with memory, or just start a conversation. The interface is designed to stay out of your way.</p><div class="quick-grid"><button class="quick" data-prompt="What can you do?"><strong>✦ Explore capabilities</strong><span>See what Acerola can do right now.</span></button><button class="quick" data-prompt="What is my current status?"><strong>◉ Check system status</strong><span>Inspect the Agent Core and tools.</span></button><button class="quick" data-prompt="Remember that I am building Acerola AI."><strong>▣ Test memory</strong><span>Try Acerola\'s persistent memory.</span></button><button class="quick" data-prompt="Calculate 144 × 37."><strong>⌁ Run a calculation</strong><span>Use the built-in calculator tool.</span></button></div></div><div class="messages" id="messages"></div></div></div><div class="composer-wrap"><form class="composer" id="composer"><button type="button" class="round-btn" id="mic" title="Voice input">🎙</button><div class="text-box"><textarea id="acerola-input" rows="1" autocomplete="off" placeholder="Message Acerola AI…"></textarea></div><button type="submit" class="send-btn" id="send" title="Send">↑</button></form><div class="composer-hint">Enter to send · Shift + Enter for a new line</div></div></div>';
chatMessages=$('#messages');const input=$('#acerola-input');const resize=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'};input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});$('#composer').addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v||busy)return;input.value='';resize();handle(v)});document.querySelectorAll('.quick').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;resize();input.focus()}));setupVoice();input.focus()}
function addChat(who,text,thinking=false){if(!chatMessages)return null;$('#welcome')?.classList.add('hidden');const row=messageRow(who,text,thinking);chatMessages.appendChild(row);const sc=$('#chatScroll');sc.scrollTop=sc.scrollHeight;if(who==='Acerola'&&!thinking)core.recordAssistant(text);syncStats();return row}
async function handle(text){if(busy)return;busy=true;$('#send').disabled=true;$('#acerola-input').disabled=true;addChat('You',text);const thinking=addChat('Acerola','',true);try{const result=await core.process(text,{source:'web-ui'});thinking?.remove();if(result.type==='memory')addChat('Acerola',result.text);else if(result.type==='action')addChat('Acerola',typeof result.result==='object'?JSON.stringify(result.result,null,2):String(result.result));else if(result.type==='status')addChat('Acerola','Core '+result.version+' · '+result.memoryCount+' memories · '+result.conversationTurns+' conversation turns · '+result.tools.length+' tools');else if(result.type==='model_request'){$('#topStatus').textContent='AI THINKING';const response=await core.gateway.complete(result.payload);if(response.plan?.type==='tool_call'){const executed=await core.executePlannedAction(response.plan);if(!executed?.ok)throw new Error(executed?.error||'Action failed');addChat('Acerola',typeof executed.result==='object'?JSON.stringify(executed.result,null,2):String(executed.result))}else{const reply=response.plan?.message||response.reply||response.message;if(!reply)throw new Error('The AI gateway returned no response');addChat('Acerola',String(reply))}$('#topStatus').textContent='CORE ONLINE'}else addChat('Acerola','I could not classify that request yet.')}catch(e){thinking?.remove();addChat('Acerola','I hit a gateway error: '+(e.message||'Unable to complete request.'));$('#topStatus').textContent='GATEWAY ERROR';notify('AI gateway error')}finally{busy=false;$('#send').disabled=false;$('#acerola-input').disabled=false;syncStats();$('#acerola-input').focus()}}
function setupVoice(){const mic=$('#mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){mic.disabled=true;mic.title='Voice input is not supported on this browser';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.continuous=false;r.onstart=()=>mic.classList.add('mic-active');r.onend=()=>mic.classList.remove('mic-active');r.onerror=()=>{mic.classList.remove('mic-active');notify('Voice input was not available')};r.onresult=e=>{$('#acerola-input').value=e.results[0][0].transcript;$('#acerola-input').dispatchEvent(new Event('input'));$('#acerola-input').focus()};mic.onclick=()=>{try{r.start()}catch(_){}}}
function dashboardView(){$('#title').textContent='Dashboard';$('#subtitle').textContent='A live overview of the Acerola Agent Core';$('#view').innerHTML=shell('<div class="dashboard-hero"><div class="eyebrow"><i></i> ACEROLA // ONLINE</div><h2>Build. Think. Execute.</h2><p>Acerola AI is a modular agent workspace — combining conversation, memory and safe built-in actions in one interface.</p><div class="stat-grid"><div class="stat"><small>Memory</small><b data-memory-count>0</b></div><div class="stat"><small>Conversation</small><b data-conversation-count>0</b></div><div class="stat"><small>Core tools</small><b>14</b></div><div class="stat"><small>Gateway</small><b style="font-size:13px;margin-top:7px">ONLINE</b></div></div></div><div class="section-head"><h3>Core capabilities</h3><span>Built for the next phase</span></div><div class="feature-grid"><div class="feature-card"><div class="feature-icon">✦</div><strong>AI reasoning</strong><p>Natural conversation through the AI gateway with Agent Core context.</p></div><div class="feature-card"><div class="feature-icon">▣</div><strong>Long-term memory</strong><p>Store, search and manage memories scoped to the current session.</p></div><div class="feature-card"><div class="feature-icon">⚡</div><strong>Action engine</strong><p>Time, date, calculations, status and interface actions through a controlled tool layer.</p></div><div class="feature-card"><div class="feature-icon">🎙</div><strong>Voice input</strong><p>Use supported browser speech recognition to talk to Acerola.</p></div><div class="feature-card"><div class="feature-icon">◌</div><strong>Modular UI</strong><p>Chat, dashboard, memory, tools and settings stay separated and easy to expand.</p></div><div class="feature-card"><div class="feature-icon">◈</div><strong>Mobile-first</strong><p>A responsive interface that keeps the composer close to the keyboard on phones.</p></div></div>')}
function memoryView(){$('#title').textContent='Memory';$('#subtitle').textContent='What Acerola currently remembers in this session';const memories=core.memory?.all?.()||[];let rows=memories.map((m,i)=>'<div class="memory-row"><div class="memory-main"><strong>Memory '+(i+1)+'</strong><span>'+esc(m)+'</span></div><button data-remove-memory="'+i+'" title="Forget">×</button></div>').join('');if(!rows)rows='<div class="empty">No memories saved yet.<br>Ask Acerola to remember something from Chat.</div>';$('#view').innerHTML=shell('<div class="section-head" style="margin-top:0"><h3>Persistent memory</h3><span>'+memories.length+' saved</span></div><div class="panel"><div class="list" id="memoryList">'+rows+'</div></div><div class="section-head"><h3>How it works</h3></div><div class="two-col"><div class="panel"><strong style="font-size:12px">Session-scoped storage</strong><p>Acerola uses the Agent Core memory layer. Remote memory is isolated to the authenticated session, with local fallback when the gateway is unavailable.</p></div><div class="panel"><strong style="font-size:12px">Your control</strong><p>You can forget individual memories or clear the memory store from Settings.</p></div></div>');document.querySelectorAll('[data-remove-memory]').forEach(b=>b.addEventListener('click',async()=>{const value=memories[Number(b.dataset.removeMemory)];if(value===undefined)return;try{const removed=await core.forget(value);notify(removed?'Memory removed':'Memory not found');memoryView()}catch(e){notify('Could not remove memory')}}))}
function toolsView(){$('#title').textContent='Tools';$('#subtitle').textContent='Built-in actions available to the Agent Core';const tools=['memory.recent','memory.search','memory.add','memory.remove','memory.clear','conversation.recent','conversation.clear','system.time','system.date','system.status','system.capabilities','calculator.calculate','ui.open_module','ui.notify'];const desc={'memory.recent':'Read recent saved memories.','memory.search':'Search stored memories.','memory.add':'Save a new memory.','memory.remove':'Forget a selected memory.','memory.clear':'Clear session memory.','conversation.recent':'Read recent conversation context.','conversation.clear':'Clear local conversation context.','system.time':'Return the current time.','system.date':'Return the current date.','system.status':'Inspect core status.','system.capabilities':'List available capabilities.','calculator.calculate':'Evaluate a calculation.','ui.open_module':'Open a workspace module.','ui.notify':'Show a UI notification.'};$('#view').innerHTML=shell('<div class="section-head" style="margin-top:0"><h3>Agent Core tools</h3><span>'+tools.length+' available</span></div><div class="tool-grid">'+tools.map(t=>'<div class="tool-row"><div class="feature-icon">⚡</div><div><div class="tool-name">'+t+'</div><div class="tool-desc">'+desc[t]+'</div></div></div>').join('')+'</div><div class="section-head"><h3>Safety layer</h3></div><div class="panel"><strong style="font-size:12px">Controlled execution</strong><p>Model plans are validated against the built-in tool allowlist before an action can execute. The browser never receives the private AI provider key.</p></div>')}
function settingsView(){$('#title').textContent='Settings';$('#subtitle').textContent='Control your current Acerola session';$('#view').innerHTML=shell('<div class="section-head" style="margin-top:0"><h3>Session</h3></div><div class="settings-list"><div class="setting-row"><div><strong>Conversation history</strong><p>Clear the conversation stored by the Agent Core.</p></div><button class="btn danger" id="clearConversation">Clear conversation</button></div><div class="setting-row"><div><strong>Persistent memory</strong><p>Remove memories saved for this session.</p></div><button class="btn danger" id="clearMemory">Clear memory</button></div><div class="setting-row"><div><strong>Interface</strong><p>Responsive layout with mobile keyboard-aware composer.</p></div><span class="badge">MOBILE READY</span></div><div class="setting-row"><div><strong>AI gateway</strong><p>Secure server-side model access. Provider credentials are not exposed in the browser.</p></div><span class="badge">PROTECTED</span></div></div><div class="section-head"><h3>About</h3></div><div class="panel"><strong style="font-size:14px">Acerola AI</strong><p>Agent Core v0.9.0 · modular web interface · built for future expansion.</p><p style="margin-top:10px">Created by Michael Chukwudi.</p></div>');$('#clearConversation').onclick=async()=>{try{await core.executePlannedAction({type:'tool_call',tool:'conversation.clear',arguments:{}});notify('Conversation cleared');setView('chat')}catch(e){notify('Could not clear conversation')}};$('#clearMemory').onclick=async()=>{try{await core.executePlannedAction({type:'tool_call',tool:'memory.clear',arguments:{}});notify('Memory cleared');memoryView()}catch(e){notify('Could not clear memory')}}}
document.querySelectorAll('#sideNav [data-view],#mobileNav [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));setView('chat');syncStats();
</script>
