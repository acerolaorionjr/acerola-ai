name: Deploy Acerola AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate site files
        run: |
          test -f index.html
          test -f agent-core.js
          test -f account-system.js
          test -f chat-enhancements.js
          test -f ui-enhancements.js
          test -f support.js
      - name: Load Acerola modules
        run: |
          sed -i 's#</body>#<script src="account-system.js"></script><script src="chat-enhancements.js"></script><script src="ui-enhancements.js"></script><script src="support.js"></script></body>#' index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
