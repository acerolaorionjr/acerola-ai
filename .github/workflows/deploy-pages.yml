name: Deploy Acerola AI to GitHub Pages
run-name: Deploy Acerola AI (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript syntax (game only)
        run: |
          node --check game/game.js
          test -f game/index.html
          echo "Game JavaScript syntax OK"

      - name: Check Acerola gateway CORS preflight
        run: |
          python - <<'PY'
          import requests
          url = "https://djumpimcwzhjujysznox.supabase.co/functions/v1/acerola-ai-gateway-v2"
          origin = "http://localhost:5173"
          preflight = requests.options(
              url,
              headers={
                  "Origin": origin,
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "authorization, apikey, content-type",
              },
              timeout=20,
          )
          print("Gateway OPTIONS:", preflight.status_code, preflight.headers.get("Access-Control-Allow-Origin"))
          if preflight.status_code not in (200, 204):
              raise SystemExit("Gateway CORS preflight failed")
          if preflight.headers.get("Access-Control-Allow-Origin") != origin:
              raise SystemExit("Gateway CORS origin is not allowed")
          PY
      - name: Run browser smoke tests (diagnostic)
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check pytest requests playwright
          python -m playwright install --with-deps chromium
          pytest -m 'not live' -q
      - name: Validate site files
        run: |
          test -f index.html
          test -f agent-core.js
          test -f account-system.js
          test -f chat-enhancements.js
          test -f ui-enhancements.js
          test -f support.js
          test -f engine-runtime.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
