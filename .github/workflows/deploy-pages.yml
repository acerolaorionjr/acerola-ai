name: Deploy Acerola AI to GitHub Pages
run-name: Deploy Acerola AI (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate all JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
          echo "All JavaScript syntax checks passed"

      - name: Validate Acerola gateway CORS for production and local development
        run: |
          python - <<'PY'
          import requests
          url = "https://djumpimcwzhjujysznox.supabase.co/functions/v1/acerola-ai-gateway"
          origins = (
              "https://acerolaorionjr.github.io",
              "http://localhost:5173",
          )
          for origin in origins:
              preflight = requests.options(
                  url,
                  headers={
                      "Origin": origin,
                      "Access-Control-Request-Method": "POST",
                      "Access-Control-Request-Headers": "authorization, apikey, content-type",
                  },
                  timeout=20,
              )
              allowed = preflight.headers.get("Access-Control-Allow-Origin")
              print(f"Gateway OPTIONS for {origin}: {preflight.status_code}; allow-origin={allowed}")
              if preflight.status_code not in (200, 204):
                  raise SystemExit(f"Gateway CORS preflight failed for {origin}")
              if allowed != origin:
                  raise SystemExit(f"Gateway does not allow required origin: {origin}")
          PY
      - name: Run contract and browser smoke tests (required)
        run: |
          python -m pip install --disable-pip-version-check pytest requests playwright
          python -m playwright install --with-deps chromium
          pytest -m 'not live' -q
      - name: Validate site files
        run: |
          test -f index.html
          test -f agent-core.js
          test -f account-system.js
          test -f chat-enhancements.js
          test -f ui-enhancements.js
          test -f support.js
          test -f engine-runtime.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify deployed Pages routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          for path, marker in (("", "Acerola"), ("sponsorship.html", "Sponsorship opportunity")):
              url = base + path
              last = None
              for attempt in range(8):
                  try:
                      response = requests.get(url, timeout=20)
                      if response.status_code == 200:
                          last = response
                          break
                      last = response
                  except requests.RequestException as exc:
                      print(f"Attempt {attempt + 1} failed for {url}: {exc}")
                  time.sleep(5)
              if last is None:
                  raise SystemExit(f"Could not reach deployed route: {url}")
              last.raise_for_status()
              if marker not in last.text:
                  raise SystemExit(f"Expected content marker missing from {url}")
              print(f"Verified {url} ({last.status_code})")
          PY
