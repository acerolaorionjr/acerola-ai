name: Deploy Acerola AI to GitHub Pages
run-name: Deploy Acerola AI (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript syntax
        run: |
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.current = []
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      kind = dict(attrs).get("type", "").lower()
                      if kind in ("application/ld+json", "application/json", "importmap"):
                          self.in_script = False
                          self.current = []
                          return
                      self.in_script = True
                      self.current = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script":
                      if self.in_script:
                          value = "".join(self.current)
                          if value.strip():
                              self.items.append(value)
                      self.in_script = False
                      self.current = []

          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          for i, source in enumerate(parser.items, 1):
              path = Path(tempfile.gettempdir()) / f"acerola-inline-{i}.js"
              path.write_text(source, encoding="utf-8")
              print(f"Checking index.html inline script #{i}")
              subprocess.run(["node", "--check", str(path)], check=True)
          PY
      - name: Check Acerola gateway CORS preflight
        run: |
          python - <<'PY'
          import requests
          url = "https://djumpimcwzhjujysznox.supabase.co/functions/v1/acerola-ai-gateway"
          origin = "http://localhost:5173"
          preflight = requests.options(
              url,
              headers={
                  "Origin": origin,
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "authorization, apikey, content-type",
              },
              timeout=20,
          )
          print("Gateway OPTIONS:", preflight.status_code, preflight.headers.get("Access-Control-Allow-Origin"))
          if preflight.status_code not in (200, 204):
              raise SystemExit("Gateway CORS preflight failed")
          if preflight.headers.get("Access-Control-Allow-Origin") != origin:
              raise SystemExit("Gateway CORS origin is not allowed")
          PY
      - name: Run browser smoke tests
        run: |
          python -m pip install --disable-pip-version-check pytest requests playwright
          python -m playwright install --with-deps chromium
          pytest -m 'not live' -q
      - name: Validate site files
        run: |
          test -f index.html
          test -f agent-core.js
          test -f account-system.js
          test -f chat-enhancements.js
          test -f ui-enhancements.js
          test -f support.js
          test -f engine-runtime.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
