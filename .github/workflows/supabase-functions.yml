name: Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Project refs are identifiers, not credentials; keep a safe default so an
      # accidentally empty repository secret cannot break every deployment.
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'djumpimcwzhjujysznox' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN. Add it under GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_ID}" ]]; then
            echo "::error::Missing SUPABASE_PROJECT_ID."
            exit 1
          fi
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Deploy all Acerola functions
        shell: bash
        run: |
          set -euo pipefail
          for function in acerola-ai-gateway acerola-image acerola-audio acerola-music acerola-live-session paystack-payment paystack-verify paystack-webhook; do
            echo "Deploying $function"
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID" --use-api
          done
