name: Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check every Acerola Edge Function
        run: |
          set +e
          failed=0
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            if ! deno check "$f"; then
              failed=1
              echo "::error file=$f::Deno type-check failed"
            fi
          done
          exit "$failed"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Deploy database migrations
        run: supabase db push --linked
      - name: Deploy all Acerola functions
        run: |
          set -e
          for function in acerola-ai-gateway acerola-image acerola-media acerola-live-session paystack-payment paystack-verify paystack-webhook; do
            echo "Deploying $function"
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID" --use-api
          done
