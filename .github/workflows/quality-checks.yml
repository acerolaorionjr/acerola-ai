name: Acerola Quality Checks
run-name: Acerola Quality Checks (${{ github.sha }})

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 node --check
          echo "All JavaScript syntax checks passed."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html agent-core.js account-system.js chat-enhancements.js ui-enhancements.js support.js engine-runtime.js; do
            test -f "$file" || { echo "::error::Required file missing: $file"; exit 1; }
          done

      - name: Run isolated core and mobile browser smoke tests
        run: python -m pytest -q tests/test_agent_core.py tests/test_frontend_smoke.py
