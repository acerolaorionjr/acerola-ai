name: Acerola Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests playwright

      - name: Install browser for smoke tests
        run: python -m playwright install --with-deps chromium

      - name: Run regression and browser smoke tests
        run: python -m pytest -m 'not live' -q
