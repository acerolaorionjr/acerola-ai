name: Build Acerola AI Android APK
# Android APK CI is intentionally built on GitHub Actions so no PC is required.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.json"
      - "icon.svg"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html login.html cloud.html sponsor.html www/
          cp *.js *.svg *.webmanifest robots.txt sitemap.xml sw.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Customize Android app
        run: bash scripts/prepare-android.sh

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Acerola-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
