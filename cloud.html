<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acerola — Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050816;--panel:#0b1024;--line:#1a2445;--cyan:#00f0ff;--pink:#ff007f;--text:#eef7ff;--muted:#91a2bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#111b3d 0,#050816 42%,#02030b 100%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;height:100vh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#070b18e8;backdrop-filter:blur(14px)}.brand{display:flex;gap:10px;align-items:center}.orb{width:34px;height:34px;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 20px #00f0ff55;display:grid;place-items:center;color:var(--cyan);font-weight:900}.name{font-weight:800;letter-spacing:.08em}.status{font-size:11px;color:#72ffd9}.account{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);object-fit:cover}.btn{border:1px solid var(--line);background:#0c1329;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{border-color:var(--cyan)}.main{flex:1;display:flex;min-height:0}.side{width:250px;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;background:#070b17aa}.side h3{font-size:12px;color:var(--muted);margin:4px}.chatlist{overflow:auto;display:flex;flex-direction:column;gap:6px}.chat{padding:10px;border:1px solid transparent;border-radius:9px;cursor:pointer;color:#c8d5ea;font-size:13px}.chat:hover,.chat.active{background:#0d1630;border-color:var(--line)}.content{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px max(16px,calc((100% - 900px)/2));display:flex;flex-direction:column;gap:14px}.msg{max-width:760px;border:1px solid var(--line);border-radius:16px;padding:13px 15px;line-height:1.55;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#101a36;border-color:#26365e}.msg.assistant{align-self:flex-start;background:#080e20}.msg.system{align-self:center;color:var(--muted);font-size:12px;border-style:dashed}.composer{padding:12px max(16px,calc((100% - 900px)/2));border-top:1px solid var(--line);background:#060a15e8}.row{display:flex;gap:8px}.input{flex:1;min-height:48px;max-height:150px;resize:none;border:1px solid var(--line);border-radius:13px;background:#090f21;color:var(--text);padding:13px;outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 18px #00f0ff12}.send{min-width:76px;border-color:var(--cyan);color:var(--cyan)}.empty{margin:auto;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:24px;margin-bottom:8px}.drawer{display:none}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.card{width:min(440px,100%);background:#0a1022;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 70px #000b}.card h2{margin-top:0}.profile{display:flex;gap:12px;align-items:center;margin:15px 0}.profile img{width:56px;height:56px;border-radius:50%}.meta{color:var(--muted);font-size:12px}.danger{border-color:#ff507d;color:#ff8ba9}@media(max-width:760px){.side{display:none}.messages{padding:18px 12px}.composer{padding:10px 12px}.account .email{display:none}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="orb">A</div><div><div class="name">ACEROLA</div><div class="status" id="status">CLOUD CORE // CONNECTING</div></div></div><div class="account"><img id="avatar" class="avatar" alt="" hidden><span class="email" id="email"></span><button class="btn" id="accountBtn">Account</button></div></header>
<div class="main"><aside class="side"><button class="btn" id="newChat">＋ New chat</button><h3>CLOUD CONVERSATIONS</h3><div id="chatList" class="chatlist"></div></aside>
<section class="content"><div id="messages" class="messages"><div class="empty"><strong>Acerola</strong><span>Cloud memory and conversations are online.</span></div></div><div class="composer"><div class="row"><textarea id="input" class="input" placeholder="Talk to Acerola…" rows="1"></textarea><button class="btn send" id="send">Send</button></div></div></section></div></div>
<div class="modal" id="modal"><div class="card"><h2>ACEROLA ACCOUNT</h2><div class="profile"><img id="modalAvatar" alt=""><div><div id="modalName"></div><div class="meta" id="modalEmail"></div></div></div><div class="meta">Google account • cloud memory • synced conversations</div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn" id="closeModal">Close</button><button class="btn danger" id="signOut">Sign out</button></div></div></div>
<script>
const SUPABASE_URL='https://djumpimcwzhjujysznox.supabase.co';
const SUPABASE_KEY='sb_publishable_c34TkPz6oG437WYMSPAKww_T5mFZPy7';
const GATEWAY=SUPABASE_URL+'/functions/v1/acerola-ai-gateway';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,session=null,current=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(role,text){const box=$('messages');const empty=box.querySelector('.empty');if(empty)empty.remove();const el=document.createElement('div');el.className='msg '+role;el.textContent=text;box.appendChild(el);box.scrollTop=box.scrollHeight}
function clearMessages(){ $('messages').innerHTML=''; }
async function requireAuth(){const r=await supabase.auth.getSession();session=r.data.session;user=session?.user||null;if(!user){location.replace('./login.html');return false}return true}
async function profile(){await supabase.from('profiles').upsert({id:user.id,display_name:user.user_metadata?.full_name||user.email?.split('@')[0]||'Acerola User',avatar_url:user.user_metadata?.avatar_url||user.user_metadata?.picture||null},{onConflict:'id'});}
async function loadChats(){const {data,error}=await supabase.from('conversations').select('id,title,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false});if(error){console.error(error);return}const list=$('chatList');list.innerHTML='';(data||[]).forEach(c=>{const e=document.createElement('div');e.className='chat '+(current===c.id?'active':'');e.textContent=c.title||'New chat';e.onclick=()=>openChat(c.id);list.appendChild(e)})}
async function newConversation(){const {data,error}=await supabase.from('conversations').insert({user_id:user.id,title:'New chat'}).select('id').single();if(error){add('system','Could not create cloud conversation.');return}current=data.id;clearMessages();add('assistant','New cloud conversation ready.');await loadChats()}
async function openChat(id){current=id;clearMessages();const {data,error}=await supabase.from('messages').select('role,content,created_at').eq('conversation_id',id).eq('user_id',user.id).order('created_at',{ascending:true});if(error){add('system','Could not load this conversation.');return}if(!data?.length)add('assistant','Cloud conversation ready.');else data.forEach(m=>add(m.role,m.content));await loadChats()}
async function ensureChat(){if(current)return current;await newConversation();return current}
async function saveMessage(role,content){const id=await ensureChat();const {error}=await supabase.from('messages').insert({conversation_id:id,user_id:user.id,role,content});if(error)console.error('message save',error);await supabase.from('conversations').update({updated_at:new Date().toISOString(),title:role==='user'?content.slice(0,50):undefined}).eq('id',id).eq('user_id',user.id);await loadChats()}
async function ask(){const text=$('input').value.trim();if(!text)return;$('input').value='';add('user',text);await saveMessage('user',text);$('send').disabled=true;$('status').textContent='CLOUD CORE // THINKING';try{const {data:{session:s}}=await supabase.auth.getSession();if(!s)throw new Error('Session expired');const res=await fetch(GATEWAY,{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({message:text,context:{app:'Acerola Cloud',conversation_id:current}})});const d=await res.json();if(!res.ok)throw new Error(d.error||'Gateway unavailable');add('assistant',d.reply||'No response.');await saveMessage('assistant',d.reply||'No response.')}catch(e){add('system','Acerola could not respond: '+e.message)}finally{$('send').disabled=false;$('status').textContent='CLOUD CORE // ONLINE'}}
function showAccount(){const u=user;const pic=u.user_metadata?.avatar_url||u.user_metadata?.picture||'';$('modalName').textContent=u.user_metadata?.full_name||u.email||'Acerola User';$('modalEmail').textContent=u.email||'';$('modalAvatar').src=pic||'';$('modal').style.display='flex'}
async function boot(){if(!await requireAuth())return;await profile();const pic=user.user_metadata?.avatar_url||user.user_metadata?.picture||'';$('email').textContent=user.email||'';if(pic){$('avatar').src=pic;$('avatar').hidden=false}$('status').textContent='CLOUD CORE // ONLINE';await loadChats();const {data}=await supabase.from('conversations').select('id').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1);if(data?.[0])await openChat(data[0].id);else await newConversation()}
$('send').onclick=ask;$('newChat').onclick=newConversation;$('accountBtn').onclick=showAccount;$('closeModal').onclick=()=>$('modal').style.display='none';$('signOut').onclick=async()=>{await supabase.auth.signOut();location.replace('./login.html')};$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});supabase.auth.onAuthStateChange((_event,s)=>{if(!s)location.replace('./login.html')});boot();
</script></body></html>
