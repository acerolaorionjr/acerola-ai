<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050816"><title>Acerola — Cloud</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050816;--panel:#0b1024;--line:#1a2445;--cyan:#00f0ff;--text:#eef7ff;--muted:#91a2bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#111b3d 0,#050816 42%,#02030b 100%);color:var(--text);font-family:system-ui,Arial,sans-serif;height:100vh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#070b18e8}.brand{display:flex;gap:10px;align-items:center}.orb{width:34px;height:34px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-weight:900;box-shadow:0 0 20px #00f0ff55}.name{font-weight:800;letter-spacing:.08em}.status{font-size:11px;color:#72ffd9}.account{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);object-fit:cover}.btn{border:1px solid var(--line);background:#0c1329;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{border-color:var(--cyan)}.main{flex:1;display:flex;min-height:0}.side{width:250px;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;background:#070b17aa}.side h3{font-size:12px;color:var(--muted);margin:4px}.chatlist{overflow:auto;display:flex;flex-direction:column;gap:6px}.chat{padding:10px;border:1px solid transparent;border-radius:9px;cursor:pointer;color:#c8d5ea;font-size:13px}.chat:hover,.chat.active{background:#0d1630;border-color:var(--line)}.content{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px max(16px,calc((100% - 900px)/2));display:flex;flex-direction:column;gap:14px}.msg{max-width:760px;border:1px solid var(--line);border-radius:16px;padding:13px 15px;line-height:1.55;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#101a36}.msg.assistant{align-self:flex-start;background:#080e20}.msg.system{align-self:center;color:var(--muted);font-size:12px;border-style:dashed}.composer{padding:12px max(16px,calc((100% - 900px)/2));border-top:1px solid var(--line);background:#060a15e8}.row{display:flex;gap:8px}.input{flex:1;min-height:48px;max-height:150px;resize:none;border:1px solid var(--line);border-radius:13px;background:#090f21;color:var(--text);padding:13px;outline:none}.send{min-width:76px;border-color:var(--cyan);color:var(--cyan)}.empty{margin:auto;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:24px;margin-bottom:8px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.card{width:min(440px,100%);background:#0a1022;border:1px solid var(--line);border-radius:16px;padding:20px}.meta{color:var(--muted);font-size:12px}.danger{border-color:#ff507d;color:#ff8ba9}@media(max-width:760px){.side{display:none}.messages{padding:18px 12px}.composer{padding:10px 12px}.account .email{display:none}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="orb">A</div><div><div class="name">ACEROLA</div><div class="status" id="status">CLOUD CORE // STARTING</div></div></div><div class="account"><img id="avatar" class="avatar" alt="" hidden><span class="email" id="email"></span><button class="btn" id="accountBtn">Account</button></div></header><div class="main"><aside class="side"><button class="btn" id="newChat">＋ New chat</button><h3>CLOUD CONVERSATIONS</h3><div id="chatList" class="chatlist"></div></aside><section class="content"><div id="messages" class="messages"><div class="empty"><strong>Acerola</strong><span>Connecting to your cloud workspace…</span></div></div><div class="composer"><div class="row"><textarea id="input" class="input" placeholder="Talk to Acerola…" rows="1"></textarea><button class="btn send" id="send">Send</button></div></div></section></div></div><div class="modal" id="modal"><div class="card"><h2>ACEROLA ACCOUNT</h2><div id="modalName"></div><div class="meta" id="modalEmail"></div><div class="meta" style="margin-top:10px">Google account • cloud memory • synced conversations</div><div style="display:flex;gap:8px;margin-top:20px"><button class="btn" id="closeModal">Close</button><button class="btn danger" id="signOut">Sign out</button></div></div></div><script>const U='https://djumpimcwzhjujysznox.supabase.co',K='sb_publishable_c34TkPz6oG437WYMSPAKww_T5mFZPy7',G=U+'/functions/v1/acerola-ai-gateway';const sb=window.supabase.createClient(U,K);let user=null,current=null;const $=id=>document.getElementById(id);function add(role,text){const box=$('messages'),e=box.querySelector('.empty');if(e)e.remove();const el=document.createElement('div');el.className='msg '+role;el.textContent=text;box.appendChild(el);box.scrollTop=box.scrollHeight}function clear(){ $('messages').innerHTML=''}function withTimeout(p,ms=8000){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Request timed out')),ms))])}async function auth(){const r=await withTimeout(sb.auth.getSession());user=r.data.session?.user;if(!user){location.replace('./login.html');return false}return true}async function syncProfile(){try{await withTimeout(sb.from('profiles').upsert({id:user.id,display_name:user.user_metadata?.full_name||user.email?.split('@')[0]||'Acerola User',avatar_url:user.user_metadata?.avatar_url||user.user_metadata?.picture||null,preferences:{}},{onConflict:'id'}))}catch(e){console.warn('profile sync',e.message)}}async function chats(){try{const r=await withTimeout(sb.from('conversations').select('id,title,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}));if(r.error)throw r.error;const list=$('chatList');list.innerHTML='';(r.data||[]).forEach(c=>{const el=document.createElement('div');el.className='chat '+(current===c.id?'active':'');el.textContent=c.title||'New chat';el.onclick=()=>openChat(c.id);list.appendChild(el)})}catch(e){console.warn('chats',e.message)}}async function newChat(){try{const r=await withTimeout(sb.from('conversations').insert({user_id:user.id,title:'New chat'}).select('id').single());if(r.error)throw r.error;current=r.data.id;clear();add('assistant','New cloud conversation ready.');await chats()}catch(e){add('system','Could not create cloud conversation: '+e.message)}}async function openChat(id){current=id;clear();try{const r=await withTimeout(sb.from('messages').select('role,content').eq('conversation_id',id).eq('user_id',user.id).order('created_at',{ascending:true}));if(r.error)throw r.error;if(!r.data?.length)add('assistant','Cloud conversation ready.');else r.data.forEach(m=>add(m.role,m.content));await chats()}catch(e){add('system','Could not load conversation: '+e.message)}}async function save(role,content){if(!current)await newChat();if(!current)return;try{await withTimeout(sb.from('messages').insert({conversation_id:current,user_id:user.id,role,content}));await withTimeout(sb.from('conversations').update({updated_at:new Date().toISOString(),title:role==='user'?content.slice(0,50):undefined}).eq('id',current).eq('user_id',user.id))}catch(e){console.warn('save',e.message)}}async function ask(){const text=$('input').value.trim();if(!text)return;$('input').value='';add('user',text);await save('user',text);$('send').disabled=true;$('status').textContent='CLOUD CORE // THINKING';try{const r=await sb.auth.getSession(),s=r.data.session;if(!s)throw new Error('Session expired');const res=await fetch(G,{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:K,'Content-Type':'application/json'},body:JSON.stringify({message:text,context:{app:'Acerola Cloud',conversation_id:current}})});const d=await res.json();if(!res.ok)throw new Error(d.error||'Gateway unavailable');add('assistant',d.reply||'No response.');await save('assistant',d.reply||'No response.')}catch(e){add('system','Acerola could not respond: '+e.message)}finally{$('send').disabled=false;$('status').textContent='CLOUD CORE // ONLINE'}}function account(){ $('modalName').textContent=user?.user_metadata?.full_name||user?.email||'Acerola User';$('modalEmail').textContent=user?.email||'';$('modal').style.display='flex'}async function boot(){try{if(!await auth())return;const pic=user.user_metadata?.avatar_url||user.user_metadata?.picture||'';$('email').textContent=user.email||'';if(pic){$('avatar').src=pic;$('avatar').hidden=false}$('status').textContent='CLOUD CORE // ONLINE';clear();add('assistant','Acerola cloud core online. Your workspace is ready.');syncProfile();try{const r=await withTimeout(sb.from('conversations').select('id').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1));if(r.data?.[0])await openChat(r.data[0].id);else await newChat()}catch(e){console.warn(e.message)}await chats()}catch(e){$('status').textContent='CLOUD CORE // ERROR';clear();add('system','Cloud startup failed: '+e.message)}}$('send').onclick=ask;$('newChat').onclick=newChat;$('accountBtn').onclick=account;$('closeModal').onclick=()=>$('modal').style.display='none';$('signOut').onclick=async()=>{await sb.auth.signOut();location.replace('./login.html')};$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});sb.auth.onAuthStateChange((_e,s)=>{if(!s)location.replace('./login.html')});boot();</script></body></html>
